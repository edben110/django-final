<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Reservas Lab</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #111111;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .login-card {
            background: linear-gradient(145deg, #1a1a1a 0%, #0d0d0d 100%);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 3.5rem 3rem;
            width: 100%;
            max-width: 480px;
            position: relative;
            overflow: hidden;
        }
        /* Reflejo sutil en la esquina */
        .login-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,255,255,0.02) 0%, transparent 70%);
            pointer-events: none;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            font-size: 0.85rem;
            margin-bottom: 2.5rem;
            transition: color 0.2s;
        }
        .back-link:hover { color: #fff; }
        .logo {
            width: 48px;
            height: 48px;
            background: #222;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            margin: 0 auto 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
        }
        h1 {
            color: #ffffff;
            text-align: center;
            font-size: 1.55rem;
            font-weight: 600;
            margin-bottom: 0.6rem;
            letter-spacing: -0.3px;
        }
        .subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.35);
            font-size: 0.9rem;
            margin-bottom: 2.5rem;
        }
        .subtitle a {
            color: #fff;
            text-decoration: underline;
            font-weight: 600;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group input {
            width: 100%;
            padding: 1rem 1.1rem;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.3s;
        }
        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }
        .form-group input:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.3);
        }
        .btn-signin {
            width: 100%;
            padding: 1rem;
            background: #ffffff;
            color: #000;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            margin-top: 1.2rem;
            transition: opacity 0.2s;
        }
        .btn-signin:hover {
            opacity: 0.9;
        }
        .divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
            color: rgba(255, 255, 255, 0.2);
            font-size: 0.8rem;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.08);
        }
        .divider span { padding: 0 1rem; }
        .btn-secondary-action {
            display: block;
            width: 100%;
            padding: 1rem;
            background: transparent;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: border-color 0.2s;
        }
        .btn-secondary-action:hover {
            border-color: rgba(255, 255, 255, 0.3);
        }
        .error-msg {
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 1.2rem;
            text-align: center;
        }
        .footer-text {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.2);
            line-height: 1.5;
        }
        .footer-text a {
            color: rgba(255, 255, 255, 0.35);
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <a href="{% url 'login' %}" class="back-link">‹ Back</a>

        <div class="logo">🔬</div>
        <h1>Iniciar sesión</h1>
        <p class="subtitle">
            ¿Primera vez? <a href="{% url 'register' %}">Regístrate gratis</a>
        </p>

        {% if error %}
            <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <input type="text" name="username" placeholder="Tu usuario" required autofocus>
            </div>
            <div class="form-group">
                <input type="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-signin">Sign in</button>
        </form>

        <div class="divider"><span>o</span></div>

        <a href="{% url 'register' %}" class="btn-secondary-action">Crear cuenta nueva</a>

        <p class="footer-text">
            Sistema de Reservas de Laboratorios<br>
            <a href="#">Términos de uso</a> y <a href="#">Política de privacidad</a>
        </p>
    </div>
</body>
</html>
